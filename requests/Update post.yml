info:
  name: Update post
  type: http
  seq: 1

http:
  method: PUT
  url: "{{URL}}/posts/3"
  body:
    type: json
    data: |-
      {
        "title" : "updated title",
        "content" : "updated content"
      }
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
