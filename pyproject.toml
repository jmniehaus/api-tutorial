[project]
name = "api-tutorial"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[all]>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.46",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg2-binary"]
